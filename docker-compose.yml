services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service_pos_api
    ports:
      - "${API_PORT:-5264}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-micro_service_1};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-dinushA@727}
      - ApplyMigrationsAtStartup=${APPLY_MIGRATIONS:-true}
      - Jwt__Key=${JWT_KEY:-replace-with-a-long-random-secret-at-least-32-characters}
      - Jwt__Issuer=${JWT_ISSUER:-ServiceCenterApi}
      - Jwt__Audience=${JWT_AUDIENCE:-ServiceCenterApiClients}
      - Jwt__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-60}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - service_pos_network

  db:
    image: postgres:16-alpine
    container_name: service_pos_db
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-micro_service_1}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dinushA@727}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-micro_service_1}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - service_pos_network

volumes:
  postgres_data:

networks:
  service_pos_network:
    driver: bridge
